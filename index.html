<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="See which family member your baby looks like, feature by feature. Photos stay on your phone."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Baby Features" />
    <title>Baby Features</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="theme-font" rel="stylesheet" />
    <script>
      (function () {
        var key = "baby-features-appearance";
        var choice = "clarity";
        try {
          var saved = localStorage.getItem(key);
          if (saved) choice = saved;
        } catch (e) {}
        var skins = { clarity: 1, neon: 1, cozy: 1, command: 1, headline: 1, lavender: 1 };
        if (choice !== "system" && !skins[choice]) choice = "clarity";
        var dark = false;
        try {
          dark = matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        var theme = choice === "system" ? (dark ? "neon" : "clarity") : choice;
        var root = document.documentElement;
        root.setAttribute("data-appearance", choice);
        root.setAttribute("data-theme", theme);
        var color = {
          clarity: "#ffffff",
          neon: "#0b0b12",
          cozy: "#fff8f1",
          command: "#f1f5f9",
          headline: "#f4f1ea",
          lavender: "#f5f1ff",
        }[theme];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && color) meta.setAttribute("content", color);
        var fonts = {
          clarity: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap",
          neon: "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap",
          cozy: "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap",
          command: "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap",
          headline: "https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap",
          lavender: "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap",
        };
        var link = document.getElementById("theme-font");
        if (link && fonts[theme]) link.setAttribute("href", fonts[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>Baby Features needs JavaScript. Photos are only analyzed in the browser.</noscript>
  </body>
</html>
